workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies and build
        script: |
          npm install --legacy-peer-deps
          npm run build
    artifacts:
      - dist/*.apk
      - build/app/outputs/flutter-apk/*.apk
