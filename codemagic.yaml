workflows:
  android-workflow:
    name: android-workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get packages
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - patelchintana1234567@gmail.com
