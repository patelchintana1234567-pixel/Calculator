workflows:
  android-workflow:
    name: android-workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
      - name: Build web
        script: |
          npm run build
      - name: Fix Capacitor config for Codemagic
        script: |
          echo "Fixing config file..."
          rm -f capacitor.config.ts
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.calculator.app",
            "appName": "Calculator",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
      - name: Sync to Android
        script: |
          npx @capacitor/cli sync android
      - name: Build APK
        script: |
          cd android
          # કમાન્ડ જે ઓટોમેટિક ગ્રેડલ સેટ કરી દેશે
          gradle wrapper --gradle-version 8.0
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
