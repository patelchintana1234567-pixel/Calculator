apply plugin: 'com.android.application'

android {
    namespace "com.patelchintana.calculator"
    compileSdk 34
    defaultConfig {
        applicationId "com.patelchintana.calculator"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}
